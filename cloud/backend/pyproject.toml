[project]
name = "campus-patrol-api"
version = "0.1.0"
description = "Local task API adapted from the official FastAPI full-stack template"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<1",
  "sqlmodel>=0.0.46,<0.1",
  "pydantic-settings>=2.15,<3",
  "email-validator>=2.1,<3",
  "httpx>=0.28,<1",
  "pyjwt>=2.15,<3",
  "pwdlib[argon2,bcrypt]>=0.3,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
